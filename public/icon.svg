<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Back document layer -->
  <path d="M170 120 h170 l60 60 v210 a16 16 0 0 1 -16 16 h-214 a16 16 0 0 1 -16 -16 v-254 a16 16 0 0 1 16 -16 z" fill="#1e40af" opacity="0.4"/>

  <!-- Main Document Page -->
  <g filter="url(#shadow)">
    <path d="M140 140 h160 l60 60 v200 a16 16 0 0 1 -16 16 h-204 a16 16 0 0 1 -16 -16 v-244 a16 16 0 0 1 16 -16 z" fill="#ffffff"/>
    <!-- Folded corner -->
    <path d="M300 140 v48 a12 12 0 0 0 12 12 h48 z" fill="url(#fold)"/>
  </g>

  <!-- Red PDF Badge -->
  <rect x="156" y="226" width="76" height="34" rx="6" fill="#ef4444"/>
  <text x="194" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">PDF</text>

  <!-- Image icon symbol inside document -->
  <rect x="156" y="280" width="168" height="96" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="4"/>
  <!-- Mountain shapes -->
  <path d="M174 352 l38 -46 l32 36 l24 -26 l40 36 z" fill="#3b82f6"/>
  <!-- Sun -->
  <circle cx="202" cy="308" r="10" fill="#f59e0b"/>
</svg>
